<!DOCTYPE html>
<html lang="es">

<head meta charset="UFT-8">
    <title> MR Club </title>
    <link rel="stylesheet" href="../accets/CSS/estilos.css">

    <head>

    <body>
        <div class="contenedor-formulario">
            <h2> Registro de asociados <h2>
                <p> Ingrese sus datos </p>
                    <div>
                        <form id="formregistro" action="" method="POST">
                            <div class="grupo-input">
                                <div>
                                    <div class="grupo-input">
                                        <label> Ingrese su documento</label>
                                        <input id="documento" type="number" required placeholder="Ejemplo: 1025064602">
                                    </div>
                                    <div class="grupo-input">
                                        <label> Ingrese su nombre</label>
                                        <input type="text" id="nombre" required placeholder="Ingresar nombre completo">
                                    </div>
                                    <div class="grupo-input">
                                        <label> Ingresar apellido</label>
                                        <input type="text" id="apellido" required
                                            placeholder="Ingresar apellido completo">
                                    </div>
                                    <div class="grupo-input">
                                        <label> Fecha de nacimiento</label>
                                        <input type="date" id="fechaNacimiento" required
                                            placeholder="Ejemplo: 08/08/2009">
                                    </div>
                                    <div class="grupo-input">
                                        <label> Ingresar direccion</label>
                                        <input type="text" id="direccion" required
                                            placeholder="Ejemplo: car 26a #24-25">
                                    </div>
                                    <div class="grupo-input">
                                        <label> Ingresar telefono</label>
                                        <input id="telefono" type="number" required placeholder="Ejemplo: 3133916257">
                                    </div>
                                    <div class="grupo-input">
                                        <label> Ingresar su email </label>
                                        <input type="text" id="email" required placeholder="Ejemplo: juan@gmail.com">
                                    </div>
                                    <div class="grupo-input">
                                        <label> Ingresar su ciudad </label>
                                        <select id="ciudad" required>
                                            <option value="sogamoso"> Sogamoso </option>>
                                            <option value="duitama"> Duitama </option>>
                                            <option value="nobsa"> Nobsa </option>>
                                            <input type="text" id="ciudad" required placeholder="Ingrese su ciudad">
                                    </div>
                                    <div class="grupo-input">
                                        <label> Ingresar su genero </label>
                                        <label>
                                            <input type="radio" id="femenino" name="genero" values="femenino">
                                            <spam>Femenino</spam>
                                            <label>
                                                <label>
                                                    <input type="radio" id="masculino" name="genero" values="masculino">
                                                    <spam>Masculino</spam>
                                                    <label>
                                                        <label>
                                                            <input type="radio" id="otro" name="genero" values="otro">
                                                            <spam>Otro</spam>
                                                            <label>
                                    </div>
                                    <div class="grupo-botones">
                                        <button type="submit"> Guardar </button>
                                        <button type="reset"> Limpiar todo </button>
                                    </div>
                        </form>

<body>
    <html>
