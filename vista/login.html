<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>MR CLUB</title>
        <link rel="stylesheet" href="../accets/CSS/estilos.css">
    </head>
    <body>
        <div>
            <h2>Inicio de Sesión</h2>
            <form id="formLogin" action="" method="POST">
                
                <div class="grupo-input">
                    <label>Usuario:</label>
                    <input id="usuario" type="text" required placeholder="Ingrese su usuario">
                </div>

                <div class="grupo-input">
                    <label>Contraseña:</label>
                    <input id="contraseña" type="password" required placeholder="Ingrese su contraseña">
                </div>

                <div class="grupo-botones">
                    <button type="submit">Ingresar</button>
                    <button type="reset">Limpiar Formulario</button>
                </div>
                
            </form>
        </div>
    </body>
</html>
